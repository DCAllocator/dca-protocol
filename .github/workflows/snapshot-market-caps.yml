name: Snapshot stock market caps

# Refreshes apps/web/src/data/market-caps.json from CoinGecko's "Robinhood Chain Stocks Ecosystem"
# category so the app's stock lists rank by market cap without querying CoinGecko on page load.
# See apps/web/scripts/snapshot-market-caps.mjs and useRankedStocks in apps/web/src/hooks/useProtocol.ts.
# main only takes pull requests, so each run force-pushes the new snapshot to one rolling branch and keeps a single
# PR open for it; merge it whenever the ranking should move.

on:
  schedule:
    - cron: "17 6 * * *" # daily, ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write # push the snapshot branch
  pull-requests: write # open its PR (also needs "Allow GitHub Actions to create and approve pull requests")
  actions: write # start the required contracts check on it

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch CoinGecko market caps
        run: node scripts/snapshot-market-caps.mjs

      - name: Open or update the snapshot PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/market-caps
          TITLE: Refreshed the stock market-cap snapshot
        run: |
          if git diff --quiet -- src/data/market-caps.json; then
            echo "No change in market caps."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data/market-caps.json
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Daily CoinGecko market-cap snapshot from snapshot-market-caps.yml. Each run replaces this branch with the latest data."
          fi
          # A push made with GITHUB_TOKEN triggers no workflows, so start the required check on the new commit.
          gh workflow run contracts.yml --ref "$BRANCH"
