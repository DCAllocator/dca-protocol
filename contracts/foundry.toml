[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }]
gas_reports = ["PlanVault", "AggregatorRouter", "UniV3Adapter", "UniV4Adapter", "EpochKeeper"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci]
fuzz = { runs = 2048 }
invariant = { runs = 256, depth = 64 }

[rpc_endpoints]
robinhood = "${RH_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
